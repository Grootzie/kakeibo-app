# Parcours « maison » (critère de J4, #88) : les trois états d'un objet, une capture par état,
# dans la maison (E8). Installée le mercredi 4 novembre 2026 avec le budget de démonstration.
# 1. Semaine 45, chaque jour clôturé, rien dépensé : la capsule s'ouvre sur le râteau
#    porte-bonheur kumade, intact (capture « maison-intact »).
# 2. Semaine 46, 150 € notés le lundi 9 pour une enveloppe de 140 €, chaque jour clôturé : le chat
#    porte-bonheur entre et le kumade, l'objet intact le plus récent, se fêle. Sa réparation part
#    du lundi 16 ; mercredi 18, « Réparation : 3 jours sur 7 » (capture « maison-fele »).
# 3. Jeudi 19 à dimanche 22 : la septième clôture d'affilée répare le kumade à l'or, annoncé à la
#    clôture, puis le bilan de la semaine 47 s'ouvre (capture « maison-repare »). C'est l'exemple
#    de la spec (E8) : gagné la semaine du 2 novembre, fêlé le 15, réparé à l'or le 22.
# Le même enchaînement est rejoué avec le vrai store dans src/state/parcoursMaison.test.ts.
# Joué par tools/parcours-android.sh après avoir effacé les données de l'appli et réglé l'heure
# du téléphone au mercredi 4 novembre 2026 à 9:00. L'horloge de test avance les jours.
# Budget de démonstration : 1 200 € de revenus, 600 € de charges fixes, 0 € d'épargne.
appId: app.kakeibo
