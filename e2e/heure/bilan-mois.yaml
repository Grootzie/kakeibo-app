# Bilan du mois (E7, J3.4, #64) : novembre dépasse son budget (675 € dépensés pour 600 €) ; le
# 4 décembre, E7 chiffre Q1 à Q3 par catégorie et l'épargne réelle, sans reproche ; la
# résolution s'écrit en 140 caractères au plus ; après la validation, le budget de décembre se
# confirme pré-rempli, ici avec des revenus changés (J3.5, #65), et la pièce de décembre s'ouvre.
# De retour sur l'accueil, la résolution s'affiche dans le bandeau une fois les bilans de semaine
# vus et les jours oubliés rattrapés ; l'enveloppe suit le nouveau budget la semaine suivante.
# Joué par tools/parcours-android.sh après avoir effacé les données de l'appli et réglé l'heure
# du téléphone au mercredi 4 novembre 2026 à 9:00. L'horloge de test avance d'un mois.
# Le bilan des semaines (E6) n'existe pas encore (J3.2) : il passe avant celui du mois sur
# l'accueil, alors E7 s'ouvre ici par son lien (kakeibo://bilan-mois), et le réglage caché
# marque les bilans de semaine vus.
# Budget de démonstration : 1 200 € de revenus, 600 € de charges fixes, 0 € d'épargne.
appId: app.kakeibo
---
- launchApp
- extendedWaitUntil:
    visible: 'Clôturer ma journée'
    timeout: 60000
- longPressOn: 'mercredi.4.novembre'
- extendedWaitUntil:
    visible: 'Horloge de test'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 'Poser un budget de démonstration.*'
    direction: DOWN
- tapOn: 'Poser un budget de démonstration.*'
- assertVisible: 'Budget de démonstration posé'
- scrollUntilVisible:
    element:
      text: 'mercredi.4.novembre'
    direction: UP
# 1. Deux dépenses en novembre : 650 € en Essentiel, 25 € en Culture.
- tapOn: 'Noter une dépense'
- assertVisible: 'Enregistrer en Essentiel'
- inputText: '650'
# Pas de « hideKeyboard » : sur Android, Maestro envoie « Retour », qui ferme la feuille (Modal).
- tapOn: 'Enregistrer en Essentiel'
- extendedWaitUntil:
    visible: 'Première dépense'
    timeout: 10000
- tapOn: 'Fermer l’explication .*Première dépense.*'
- extendedWaitUntil:
    notVisible: 'Première dépense'
    timeout: 10000
- tapOn: 'Noter une dépense'
- assertVisible: 'Enregistrer en Culture'
- inputText: '25'
- tapOn: 'Enregistrer en Culture'
- extendedWaitUntil:
    visible: 'Tu as dépassé de 575.€ cette semaine'
    timeout: 10000
# 2. Vendredi 4 décembre : le bilan de novembre est à faire.
- scrollUntilVisible:
    element:
      text: '\+1 mois'
    direction: DOWN
- tapOn: '\+1 mois'
- scrollUntilVisible:
    element:
      text: 'vendredi.4.décembre'
    direction: UP
- extendedWaitUntil:
    visible: 'vendredi.4.décembre'
    timeout: 10000
- openLink: 'kakeibo://bilan-mois'
- extendedWaitUntil:
    visible: 'Bilan de novembre'
    timeout: 10000
- assertVisible: 'Ce que j’avais.: 600.€'
- assertVisible: 'Ce que je voulais mettre de côté.: 0.€'
- assertVisible: 'Ce que j’ai dépensé.: 675.€'
- assertVisible: 'Essentiel.: 650.€'
- assertVisible: 'Culture.: 25.€'
- assertVisible: 'Ce que j’ai vraiment épargné.: −75.€'
- assertVisible: 'Ton épargne n’a pas atteint ton objectif ce mois-ci\..*'
- takeScreenshot: captures/bilan-mois-questions
# 3. La quatrième question, avec son compteur.
- tapOn: 'Comment puis-je faire mieux.*Texte libre.*'
- inputText: 'Cuisiner le soir.'
- assertVisible: '17/140'
- takeScreenshot: captures/bilan-mois-resolution
# 4. Valider : le budget de décembre se confirme, pré-rempli avec le budget de démonstration.
- scrollUntilVisible:
    element:
      text: 'Valider mon bilan'
    direction: DOWN
- tapOn: 'Valider mon bilan'
- extendedWaitUntil:
    visible: 'Ton budget de décembre'
    timeout: 10000
- assertVisible: 'Bilan de novembre enregistré\.'
- assertVisible: 'Budget du mois.: 600.€'
- assertNotVisible: 'La pièce de décembre s’ouvre.*'
- takeScreenshot: captures/bilan-mois-budget
# Revenus à 600 € : budget du mois à 0 €, le bouton reste inactif et le dit sans reproche.
- tapOn: 'Revenus, en euros'
- eraseText: 10
- inputText: '600'
- assertVisible: 'Budget du mois.: 0.€'
- assertVisible: 'Ton budget du mois doit être supérieur à 0.€\.'
- takeScreenshot: captures/bilan-mois-budget-nul
- tapOn: 'Confirmer mon budget'
- assertVisible: 'Ton budget de décembre'
- assertNotVisible: 'La pièce de décembre s’ouvre.*'
# Revenus de décembre : 1 355 € au lieu de 1 200 €, soit 755 € de budget du mois.
- eraseText: 10
- inputText: '1355'
- assertVisible: 'Budget du mois.: 755.€'
# Entrée valide le champ et ferme le clavier, qui cachait le bouton (sans « hideKeyboard »,
# qui envoie « Retour »).
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: 'Confirmer mon budget'
    direction: DOWN
    centerElement: true
- takeScreenshot: captures/bilan-mois-budget-change
- tapOn: 'Confirmer mon budget'
# 5. La pièce de décembre s'ouvre.
- extendedWaitUntil:
    visible: 'La pièce de décembre s’ouvre.: c’est le mois d’Ōmisoka, le réveillon\.'
    timeout: 10000
- assertVisible: 'Bilan de novembre enregistré\.'
- assertNotVisible: 'Valider mon bilan'
- assertNotVisible: 'Confirmer mon budget'
- takeScreenshot: captures/bilan-mois-valide
# 6. Retour à l'accueil : le bilan du mois n'y est plus proposé ; l'enveloppe de la semaine du
# 30 novembre suit encore le budget en vigueur le lundi : 20 € + 6 × 600 € / 31 = 136,13 €.
- tapOn: 'Retour à l’accueil'
- extendedWaitUntil:
    visible: 'vendredi.4.décembre'
    timeout: 10000
- assertNotVisible: 'Le bilan de novembre est prêt\.'
- assertVisible: 'Il te reste 136,13.€ jusqu’à dimanche'
- runFlow:
    when:
      visible: 'Premier jour à rattraper'
    commands:
      - tapOn: 'Fermer l’explication .*Premier jour à rattraper.*'
      - extendedWaitUntil:
          notVisible: 'Premier jour à rattraper'
          timeout: 10000
# 7. Bilans de semaine vus (réglage caché, en attendant E6), puis les quatre jours oubliés
# rattrapés depuis le bandeau : il ne reste que la résolution.
# Le réglage caché est resté ouvert depuis l'étape 2 : l'appui long le refermerait.
- runFlow:
    when:
      notVisible: 'Horloge de test'
    commands:
      - longPressOn: 'vendredi.4.décembre'
- scrollUntilVisible:
    element:
      text: 'Marquer les bilans de semaine vus'
    direction: DOWN
- tapOn: 'Marquer les bilans de semaine vus'
- assertVisible: 'Bilans de semaine marqués vus'
- scrollUntilVisible:
    element:
      text: 'vendredi.4.décembre'
    direction: UP
- tapOn: 'Tu peux encore rattraper lundi.30.novembre\.'
- assertVisible: 'Rattraper lundi.30.novembre'
- tapOn: 'Rien dépensé aujourd’hui'
- extendedWaitUntil:
    visible: 'Tu peux encore rattraper mardi.1er.décembre\.'
    timeout: 10000
- runFlow:
    when:
      visible: 'Premier tampon'
    commands:
      - tapOn: 'Fermer l’explication .*Premier tampon.*'
      - extendedWaitUntil:
          notVisible: 'Premier tampon'
          timeout: 10000
- tapOn: 'Tu peux encore rattraper mardi.1er.décembre\.'
- assertVisible: 'Rattraper mardi.1er.décembre'
- tapOn: 'Rien dépensé aujourd’hui'
- extendedWaitUntil:
    visible: 'Tu peux encore rattraper mercredi.2.décembre\.'
    timeout: 10000
- tapOn: 'Tu peux encore rattraper mercredi.2.décembre\.'
- assertVisible: 'Rattraper mercredi.2.décembre'
- tapOn: 'Rien dépensé aujourd’hui'
- extendedWaitUntil:
    visible: 'Tu peux encore rattraper jeudi.3.décembre\.'
    timeout: 10000
- tapOn: 'Tu peux encore rattraper jeudi.3.décembre\.'
- assertVisible: 'Rattraper jeudi.3.décembre'
- tapOn: 'Rien dépensé aujourd’hui'
# 8. La résolution de novembre s'affiche dans le bandeau, tout le mois de décembre.
- extendedWaitUntil:
    visible: 'Ta résolution du mois.: «.Cuisiner le soir\..»'
    timeout: 10000
- assertNotVisible: 'Tu peux encore rattraper.*'
- takeScreenshot: captures/accueil-resolution
# 9. Semaine du 7 décembre : l'enveloppe suit le budget de décembre, 7 × 755 € / 31 = 170,48 €.
- scrollUntilVisible:
    element:
      text: '\+1 semaine'
    direction: DOWN
- tapOn: '\+1 semaine'
- scrollUntilVisible:
    element:
      text: 'vendredi.11.décembre'
    direction: UP
- extendedWaitUntil:
    visible: 'Il te reste 170,48.€ jusqu’à dimanche'
    timeout: 10000
- takeScreenshot: captures/accueil-budget-decembre
- launchApp:
    clearState: true
