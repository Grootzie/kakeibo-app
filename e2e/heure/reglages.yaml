# Réglages (E10, J5.6, #105) : ouverts depuis l'en-tête de l'accueil. Le budget du mois (revenus
# changés, puis une dépense récurrente ajoutée), le rappel du soir (notifications pas encore
# autorisées : l'écran explique comment les activer), À propos et son lien vers Comprendre, puis
# « Tout effacer » avec ses deux confirmations, qui ramène à la bienvenue (E1).
# Joué par tools/parcours-android.sh après avoir effacé les données de l'appli et réglé l'heure
# du téléphone au mercredi 4 novembre 2026 à 9:00.
# Notifications refusées : `pm clear` ne retire pas l'autorisation accordée par les parcours
# précédents (bienvenue, rappel du soir) ; sans ce refus, l'explication ne s'afficherait pas.
appId: app.kakeibo
---
- launchApp:
    permissions:
      notifications: deny
# Bienvenue (E1, #101) : l'APK de développement la passe (réglage caché), sans budget.
- extendedWaitUntil:
    visible: 'Passer la bienvenue \(horloge de test\)'
    timeout: 60000
- tapOn: 'Passer la bienvenue \(horloge de test\)'
- extendedWaitUntil:
    visible: 'Clôturer ma journée'
    timeout: 60000
# 1. Budget de démonstration (1 200 € de revenus, 600 € de charges fixes), puis les réglages.
- longPressOn: 'mercredi.4.novembre'
- extendedWaitUntil:
    visible: 'Horloge de test'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 'Poser un budget de démonstration.*'
    direction: DOWN
- tapOn: 'Poser un budget de démonstration.*'
- assertVisible: 'Budget de démonstration posé'
- scrollUntilVisible:
    element:
      text: 'mercredi.4.novembre'
    direction: UP
- tapOn: 'Ouvrir les réglages'
- extendedWaitUntil:
    visible: 'Fermer les réglages'
    timeout: 10000
- assertVisible: 'Réglages'
- assertVisible: 'Budget du mois'
- assertVisible: 'Charges fixes du mois.: 600.€'
- assertVisible: 'Budget du mois.: 600.€'
- takeScreenshot: captures/reglages
# 2. Revenus portés à 1 300 € : une nouvelle version, appliquée à partir du lundi suivant.
- tapOn: 'Mes revenus du mois, en euros'
- eraseText: 10
- inputText: '1300'
- assertVisible: 'Budget du mois.: 700.€'
# Pas de « hideKeyboard » : sur Android, Maestro envoie « Retour », qui fermerait les réglages.
- scrollUntilVisible:
    element:
      text: 'Enregistrer mes revenus et mon épargne'
    direction: DOWN
    centerElement: true
- tapOn: 'Enregistrer mes revenus et mon épargne'
- scrollUntilVisible:
    element:
      text: 'C’est noté\. Ton enveloppe changera le lundi 9.novembre\.'
    direction: DOWN
    centerElement: true
# « C'est noté » s'affiche sous les dépenses récurrentes : avec le clavier ouvert, le rappel de la
# règle sort de l'écran. On remonte le chercher.
- scrollUntilVisible:
    element:
      text: 'Un changement s’applique à ton enveloppe à partir du lundi 9.novembre\..*'
    direction: UP
    centerElement: true
- takeScreenshot: captures/reglages-budget
# 3. Une dépense récurrente : 12 € chaque mois, le 15 (comme le scénario 23) ; les charges fixes
#    de novembre passent à 612 €. Ajoutée le 4 novembre, une échéance le 1er ne tomberait qu'en
#    décembre : novembre resterait à 600 €.
- scrollUntilVisible:
    element:
      text: 'Ajouter une dépense récurrente'
    direction: DOWN
    centerElement: true
- tapOn: 'Ajouter une dépense récurrente'
- extendedWaitUntil:
    visible: 'Nouvelle dépense récurrente'
    timeout: 10000
- tapOn: 'Libellé'
- inputText: 'Abonnement'
- scrollUntilVisible:
    element:
      text: 'Montant de chaque échéance, en euros'
    direction: DOWN
    centerElement: true
- tapOn: 'Montant de chaque échéance, en euros'
- inputText: '12'
- scrollUntilVisible:
    element:
      text: 'Jour suivant'
    direction: DOWN
    centerElement: true
- tapOn:
    text: 'Jour suivant'
    repeat: 14
- assertVisible: 'Échéance.: chaque mois, le 15'
- scrollUntilVisible:
    element:
      text: 'Enregistrer la dépense récurrente'
    direction: DOWN
    centerElement: true
- takeScreenshot: captures/reglages-fiche-charge
- tapOn: 'Enregistrer la dépense récurrente'
- scrollUntilVisible:
    element:
      text: 'Abonnement, 12.€, chaque mois, le 15'
    direction: UP
    centerElement: true
- assertVisible: 'Charges fixes, 600.€, chaque mois, le 1er'
- scrollUntilVisible:
    element:
      text: 'Charges fixes du mois.: 612.€'
    direction: UP
- assertVisible: 'Budget du mois.: 688.€'
- takeScreenshot: captures/reglages-charges
# 4. Rappel du soir : activé à 21:00 ; notifications pas autorisées (bienvenue passée), l'écran
#    explique comment les activer.
- scrollUntilVisible:
    element:
      text: 'Ouvrir les réglages du téléphone'
    direction: DOWN
    centerElement: true
- assertVisible: 'Rappel du soir activé'
- assertVisible: 'Heure du rappel.: 21 h 00'
- assertVisible: 'Les notifications sont désactivées pour Kakeibo.*'
- takeScreenshot: captures/reglages-rappel
# 5. À propos : la méthode, la confidentialité, les mentions ; « Comprendre » ouvre E12.
- scrollUntilVisible:
    element:
      text: 'Kakeibo est un outil de suivi personnel\. Il ne donne pas de conseil financier\.'
    direction: DOWN
    centerElement: true
- assertVisible: 'Confidentialité'
- takeScreenshot: captures/reglages-a-propos
- tapOn: 'Comprendre.: la méthode kakeibo et les règles de la maison'
- extendedWaitUntil:
    visible: 'Fermer Comprendre'
    timeout: 10000
- assertVisible: 'La méthode kakeibo'
- tapOn: 'Fermer Comprendre'
- extendedWaitUntil:
    visible: 'Fermer les réglages'
    timeout: 10000
# 6. Tout effacer : deux confirmations, puis la bienvenue (E1).
- scrollUntilVisible:
    element:
      text: 'Tout effacer.: dépenses, tampons, maison et budget'
    direction: DOWN
    centerElement: true
- tapOn: 'Tout effacer.: dépenses, tampons, maison et budget'
- assertVisible: 'Tout effacer.\? Tes dépenses, tes tampons, ta maison et ton budget seront supprimés de ce téléphone\.'
- tapOn: 'Continuer vers la dernière confirmation'
- scrollUntilVisible:
    element:
      text: 'Oui, tout effacer définitivement'
    direction: DOWN
    centerElement: true
- assertVisible: 'Dernière confirmation.: une fois effacées, tes données ne pourront pas être retrouvées\..*'
- takeScreenshot: captures/reglages-effacer
- tapOn: 'Oui, tout effacer définitivement'
- extendedWaitUntil:
    visible: 'La méthode en une minute'
    timeout: 10000
- assertVisible: 'Étape 1 sur 4'
- takeScreenshot: captures/reglages-efface-bienvenue
# 7. Au redémarrage, la bienvenue reste là : aucun budget.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'La méthode en une minute'
    timeout: 60000
- launchApp:
    clearState: true
