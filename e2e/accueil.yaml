# Parcours de démarrage : l'écran d'accueil affiche le bouton « Noter une dépense ».
# Il affiche aussi l'enveloppe, la carte de tampons et « Clôturer ma journée » (E2, #43), et la
# maison : la pièce du mois, lue au lecteur d'écran par sa description (J4.5, #84).
# Les parcours se jouent le mercredi 4 novembre 2026 : la pièce de novembre, Kura.
# Échoue si le texte est absent (écran blanc, erreur, lanceur Android).
# L'émulateur de l'intégration continue est parfois lent : on attend le texte jusqu'à 60 s.
appId: app.kakeibo
---
- launchApp
# Bienvenue (E1, #101) : l'APK de développement la passe (réglage caché), sans budget.
- extendedWaitUntil:
    visible: 'Passer la bienvenue \(horloge de test\)'
    timeout: 60000
- tapOn: 'Passer la bienvenue \(horloge de test\)'
- extendedWaitUntil:
    visible: 'Noter une dépense'
    timeout: 60000
- assertVisible: 'Noter une dépense'
- assertVisible: 'Clôturer ma journée'
- assertVisible: 'Il te reste .* jusqu’à dimanche'
# La maison est sous les boutons : on la fait venir à l'écran avant de la vérifier.
- scrollUntilVisible:
    element:
      text: 'Kura, la réserve, novembre 2026\..*'
    direction: DOWN
- assertVisible: 'Kura, la réserve, novembre 2026\..*'
- takeScreenshot: captures/accueil
