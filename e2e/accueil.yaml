# Parcours de démarrage : l'écran d'accueil affiche le bouton « Noter une dépense ».
# Échoue si le texte est absent (écran blanc, erreur, lanceur Android).
# L'émulateur de l'intégration continue est parfois lent : on attend le texte jusqu'à 60 s.
appId: app.kakeibo
---
- launchApp
- extendedWaitUntil:
    visible: 'Noter une dépense'
    timeout: 60000
- assertVisible: 'Noter une dépense'
- takeScreenshot: captures/accueil
