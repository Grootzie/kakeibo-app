# Émulateur Android pour les parcours Maestro et les captures d'écran.
# Lancé à la main tant qu'il n'y a ni build Android ni parcours dans e2e/.
# Maestro est libre et gratuit ; aucun secret, aucun service en ligne.
name: Émulateur Android

on:
  workflow_dispatch:
    inputs:
      apk:
        description: "Chemin de l'APK à installer (vide : seulement démarrer l'émulateur)"
        required: false
        default: ''

permissions:
  contents: read

jobs:
  parcours:
    name: Parcours Maestro et captures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Émulateur, parcours et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p captures
            if [ -n "${{ inputs.apk }}" ]; then adb install "${{ inputs.apk }}"; fi
            if ls e2e/*.yaml >/dev/null 2>&1; then maestro test e2e --format junit --output captures/maestro.xml; else echo "Aucun parcours dans e2e/"; fi
            adb exec-out screencap -p > captures/ecran.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-android
          path: captures
