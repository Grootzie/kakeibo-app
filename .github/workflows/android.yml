# Émulateur Android pour les parcours Maestro et les captures d'écran.
# Lancé sur chaque demande de fusion (il doit être vert avant fusion) et à la main. Sans chemin d'APK, construit lui-même un APK de développement
# (expo prebuild + Gradle, signé avec la clé de débogage : ni compte Expo/EAS, ni dépense).
# Maestro est libre et gratuit ; aucun secret, aucun service en ligne.
name: Émulateur Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      apk:
        description: "Chemin d'un APK déjà construit (vide : en construire un de développement)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de développement
    if: ${{ inputs.apk == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Projet Android natif
        run: npx expo prebuild --platform android --no-install
      - name: Cache de Gradle
        # La distribution de Gradle et les dépendances (Maven), une fois téléchargées,
        # ne sont plus redemandées au réseau (#49).
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Télécharger Gradle
        # Le téléchargement de Gradle par le wrapper peut échouer (504 de services.gradle.org, #49) :
        # on réessaie quatre fois ; à partir de la deuxième tentative, on va chercher la même
        # distribution là où services.gradle.org redirige : les versions GitHub de Gradle.
        run: |
          proprietes=gradle/wrapper/gradle-wrapper.properties
          for tentative in 1 2 3 4; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Téléchargement de Gradle raté (tentative $tentative)."
            sed -i -E 's#https\\?://services\.gradle\.org/distributions/gradle-([0-9.]+(-[a-z0-9]+)?)-(bin|all)\.zip#https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-\3.zip#' "$proprietes"
            grep distributionUrl "$proprietes"
            sleep $((tentative * 15))
          done
          exit 1
        working-directory: android
      - name: Construire l'APK
        # Une dépendance peut ne pas arriver (délai dépassé sur repo.maven.apache.org, #49) :
        # délais réseau allongés, plus de nouvelles tentatives par Gradle, et jusqu'à trois
        # constructions ; ce qui est déjà téléchargé ou compilé n'est pas refait.
        run: |
          for tentative in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              exit 0
            fi
            echo "Construction de l'APK ratée (tentative $tentative)."
            sleep $((tentative * 30))
          done
          exit 1
        env:
          # Horloge de test et budget de démonstration (réglage caché) dans cet APK de
          # développement, pour les parcours Maestro (#49). Jamais dans un build publié.
          EXPO_PUBLIC_HORLOGE_TEST: '1'
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: apk-developpement
          path: android/app/build/outputs/apk/release/app-release.apk

  parcours:
    needs: apk
    if: ${{ !cancelled() && (needs.apk.result == 'success' || needs.apk.result == 'skipped') }}
    name: Parcours Maestro et captures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: ${{ inputs.apk == '' }}
        with:
          name: apk-developpement
          path: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer Maestro
        # Le téléchargement peut échouer (504, #49) sans que l'installeur échoue :
        # on réessaie quatre fois, puis on vérifie que Maestro répond.
        run: |
          for tentative in 1 2 3 4; do
            if curl -fsSL "https://get.maestro.mobile.dev" | bash && "$HOME/.maestro/bin/maestro" --version; then
              break
            fi
            echo "Téléchargement de Maestro raté (tentative $tentative)."
            sleep $((tentative * 15))
          done
          "$HOME/.maestro/bin/maestro" --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Émulateur, parcours et captures
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Chaque ligne du script s'exécute dans son propre shell : le chemin passe par l'environnement.
          APK: ${{ inputs.apk || 'apk/app-release.apk' }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # Un seul script : chaque ligne de « script » s'exécuterait dans son propre shell,
          # et la capture ne serait pas prise après un échec.
          script: bash tools/parcours-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-android
          path: captures

  # Étiquette « intégration verte » (#36), voir ci.yml.
  etiquette-pose:
    name: Étiquette intégration verte · pose
    needs: [apk, parcours]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types tools/integration-verte.ts poser
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          DEMANDE: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
