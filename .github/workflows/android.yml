# Émulateur Android pour les parcours Maestro et les captures d'écran.
# Lancé sur chaque demande de fusion (il doit être vert avant fusion) et à la main. Sans chemin d'APK, construit lui-même un APK de développement
# (expo prebuild + Gradle, signé avec la clé de débogage : ni compte Expo/EAS, ni dépense).
# Maestro est libre et gratuit ; aucun secret, aucun service en ligne.
name: Émulateur Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      apk:
        description: "Chemin d'un APK déjà construit (vide : en construire un de développement)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de développement
    if: ${{ inputs.apk == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Projet Android natif
        run: npx expo prebuild --platform android --no-install
      - name: Construire l'APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: apk-developpement
          path: android/app/build/outputs/apk/release/app-release.apk

  parcours:
    needs: apk
    if: ${{ !cancelled() && (needs.apk.result == 'success' || needs.apk.result == 'skipped') }}
    name: Parcours Maestro et captures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: ${{ inputs.apk == '' }}
        with:
          name: apk-developpement
          path: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Émulateur, parcours et captures
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Chaque ligne du script s'exécute dans son propre shell : le chemin passe par l'environnement.
          APK: ${{ inputs.apk || 'apk/app-release.apk' }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p captures
            adb install "$APK"
            adb shell monkey -p app.kakeibo -c android.intent.category.LAUNCHER 1
            sleep 20
            if ls e2e/*.yaml >/dev/null 2>&1; then maestro test e2e --format junit --output captures/maestro.xml; else echo "Aucun parcours dans e2e/"; fi
            adb exec-out screencap -p > captures/ecran.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-android
          path: captures

  # Étiquette « intégration verte » (#36), voir ci.yml.
  etiquette-pose:
    name: Étiquette intégration verte · pose
    needs: [apk, parcours]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types tools/integration-verte.ts poser
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          DEMANDE: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
